<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Каталог товаров</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --secondary-bg: var(--tg-theme-secondary-bg-color, #f4f4f5);
    --text: var(--tg-theme-text-color, #1c1c1e);
    --hint: var(--tg-theme-hint-color, #8e8e93);
    --link: var(--tg-theme-link-color, #2481cc);
    --button: var(--tg-theme-button-color, #2481cc);
    --button-text: var(--tg-theme-button-text-color, #ffffff);
    --header-bg: var(--tg-theme-header-bg-color, #ffffff);
    --section-bg: var(--tg-theme-section-bg-color, #ffffff);
    --border: rgba(0,0,0,0.08);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 90px;
  }

  header.app-header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--header-bg);
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border);
  }

  header.app-header h1 {
    margin: 0 0 10px;
    font-size: 20px;
    font-weight: 700;
  }

  .categories {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
  }
  .categories::-webkit-scrollbar { display: none; }

  .cat-pill {
    flex: 0 0 auto;
    padding: 8px 14px;
    border-radius: 16px;
    background: var(--secondary-bg);
    color: var(--text);
    font-size: 14px;
    font-weight: 500;
    border: none;
    cursor: pointer;
    white-space: nowrap;
  }
  .cat-pill.active {
    background: var(--button);
    color: var(--button-text);
  }

  main { padding: 14px 16px; }

  .category-section { margin-bottom: 24px; }
  .category-section h2 {
    font-size: 16px;
    font-weight: 700;
    margin: 0 0 10px;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .card {
    background: var(--section-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .card-image {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: var(--secondary-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .card-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .card-image .placeholder {
    color: var(--hint);
    font-size: 12px;
    text-align: center;
    padding: 8px;
  }

  .card-body {
    padding: 8px 10px 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
  }

  .card-name {
    font-size: 14px;
    font-weight: 600;
    line-height: 1.25;
  }

  .card-desc {
    font-size: 12px;
    color: var(--hint);
    line-height: 1.3;
    flex: 1;
  }

  .card-article {
    font-size: 11px;
    color: var(--hint);
    opacity: 0.8;
  }

  .qty-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 4px;
  }

  .add-btn {
    width: 100%;
    padding: 7px 0;
    border-radius: 10px;
    border: none;
    background: var(--secondary-bg);
    color: var(--link);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }

  .stepper {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    background: var(--button);
    border-radius: 10px;
    overflow: hidden;
  }
  .stepper button {
    background: none;
    border: none;
    color: var(--button-text);
    font-size: 16px;
    font-weight: 700;
    width: 32px;
    height: 30px;
    cursor: pointer;
  }
  .stepper .qty-value {
    color: var(--button-text);
    font-size: 14px;
    font-weight: 700;
    min-width: 20px;
    text-align: center;
  }

  .empty-state, .loading-state {
    text-align: center;
    color: var(--hint);
    padding: 60px 20px;
    font-size: 14px;
  }

  /* Cart bar */
  .cart-bar {
    position: fixed;
    left: 16px;
    right: 16px;
    bottom: 16px;
    background: var(--button);
    color: var(--button-text);
    border-radius: 14px;
    padding: 14px 18px;
    display: none;
    align-items: center;
    justify-content: space-between;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(0,0,0,0.18);
  }
  .cart-bar.visible { display: flex; }

  /* Order screen */
  .screen {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 20;
    display: none;
    flex-direction: column;
  }
  .screen.visible { display: flex; }

  .screen-header {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--header-bg);
  }
  .screen-header .back-btn {
    background: none;
    border: none;
    color: var(--link);
    font-size: 15px;
    cursor: pointer;
    padding: 0;
  }
  .screen-header h2 {
    font-size: 17px;
    margin: 0;
  }

  .screen-body {
    padding: 16px;
    overflow-y: auto;
    flex: 1;
  }

  .order-items {
    background: var(--section-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px 12px;
    margin-bottom: 20px;
  }
  .order-item-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    gap: 10px;
  }
  .order-item-row:last-child { border-bottom: none; }
  .order-item-row .name { flex: 1; }
  .order-item-row .stepper { width: auto; flex: 0 0 96px; }

  .field {
    margin-bottom: 14px;
  }
  .field label {
    display: block;
    font-size: 13px;
    color: var(--hint);
    margin-bottom: 6px;
    font-weight: 500;
  }
  .field input, .field textarea {
    width: 100%;
    padding: 11px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--secondary-bg);
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
  }
  .field input:focus, .field textarea:focus {
    outline: 2px solid var(--button);
    outline-offset: -1px;
  }

  .submit-btn {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: none;
    background: var(--button);
    color: var(--button-text);
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 6px;
  }
  .submit-btn:disabled { opacity: 0.5; }

  .hint-text {
    font-size: 12px;
    color: var(--hint);
    margin: -8px 0 16px;
  }

  .success-state {
    text-align: center;
    padding: 60px 24px;
  }
  .success-state .icon {
    font-size: 48px;
    margin-bottom: 16px;
  }
  .success-state h2 { margin: 0 0 8px; font-size: 18px; }
  .success-state p { color: var(--hint); font-size: 14px; margin: 0 0 24px; }
</style>
</head>
<body>

<header class="app-header">
  <h1 id="storeName">Каталог товаров</h1>
  <div class="categories" id="categories"></div>
</header>

<main id="catalog">
  <div class="loading-state">Загружаем каталог…</div>
</main>

<div class="cart-bar" id="cartBar">
  <span id="cartBarText">В заказе: 0</span>
  <span>Оформить →</span>
</div>

<!-- Order screen -->
<div class="screen" id="orderScreen">
  <div class="screen-header">
    <button class="back-btn" id="backBtn">‹ Назад</button>
    <h2>Оформление заказа</h2>
  </div>
  <div class="screen-body" id="orderScreenBody">
    <div class="order-items" id="orderItemsList"></div>

    <div class="field">
      <label for="fCompany">Название организации</label>
      <input type="text" id="fCompany" placeholder="ООО «Ромашка»">
    </div>
    <div class="field">
      <label for="fAddress">Адрес доставки заказа</label>
      <textarea id="fAddress" rows="2" placeholder="Город, улица, дом, офис"></textarea>
    </div>
    <div class="field">
      <label for="fName">Имя заказчика</label>
      <input type="text" id="fName" placeholder="Иван Иванов">
    </div>
    <div class="field">
      <label for="fPhone">Номер телефона заказчика</label>
      <input type="tel" id="fPhone" placeholder="+7 900 000-00-00">
    </div>
    <div class="field">
      <label for="fEmail">Почта заказчика</label>
      <input type="email" id="fEmail" placeholder="name@example.com">
    </div>

    <button class="submit-btn" id="submitBtn">Отправить заказ</button>
    <div id="formError" class="hint-text" style="color:#d9534f; display:none;"></div>
  </div>
</div>

<!-- Success screen -->
<div class="screen" id="successScreen">
  <div class="screen-body">
    <div class="success-state">
      <div class="icon">✅</div>
      <h2>Заказ отправлен</h2>
      <p>Мы получили ваш заказ и скоро свяжемся с вами.</p>
      <button class="submit-btn" id="successCloseBtn">Готово</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ======= НАСТРОЙКИ =======
  // Вставьте сюда URL вашего Google Apps Script Web App (после деплоя).
  // Пример: "https://script.google.com/macros/s/AKfycb.../exec"
  var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxsNT6RJ4XhVFekiw0VNzH-xm1A_c-FSIte4VK90eICFMaAY1fa_jSQK6nAUexSo3OSIQ/exec";
  var STORE_NAME = "Батони Маркет";
  // ==========================

  document.getElementById("storeName").textContent = STORE_NAME;

  var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  if (tg) {
    tg.ready();
    tg.expand();
  }

  // Демо-данные — показываются, если Apps Script ещё не подключён,
  // чтобы можно было сразу увидеть, как выглядит приложение.
  var DEMO_PRODUCTS = [
    {
      category: "Напитки",
      items: [
        { id: "demo1", name: "Кофе в зёрнах, 1 кг", description: "Арабика, средняя обжарка", imageUrl: "", article: "КОФ-001", unit: "кг" },
        { id: "demo2", name: "Чай чёрный листовой", description: "Цейлонский, 250 г", imageUrl: "", article: "ЧАЙ-014", unit: "уп" },
        { id: "demo3", name: "Какао-порошок", description: "Натуральный, 200 г", imageUrl: "", article: "КАК-002", unit: "уп" }
      ]
    },
    {
      category: "Посуда",
      items: [
        { id: "demo4", name: "Керамическая кружка", description: "Объём 350 мл", imageUrl: "", article: "ПОС-101", unit: "шт" },
        { id: "demo5", name: "Стеклянный стакан", description: "Набор из 2 шт.", imageUrl: "", article: "ПОС-102", unit: "компл" }
      ]
    },
    {
      category: "Аксессуары",
      items: [
        { id: "demo6", name: "Тканевая салфетка", description: "Хлопок, набор 4 шт.", imageUrl: "", article: "АКС-201", unit: "уп" },
        { id: "demo7", name: "Деревянная подставка", description: "Под горячее", imageUrl: "", article: "АКС-202", unit: "шт" }
      ]
    }
  ];

  var state = {
    categories: [],   // [{category, items:[{id,name,description,imageUrl}]}]
    cart: {},         // id -> {name, qty}
    activeCategory: null,
    demoMode: false
  };

  var els = {
    categories: document.getElementById("categories"),
    catalog: document.getElementById("catalog"),
    cartBar: document.getElementById("cartBar"),
    cartBarText: document.getElementById("cartBarText"),
    orderScreen: document.getElementById("orderScreen"),
    successScreen: document.getElementById("successScreen"),
    orderItemsList: document.getElementById("orderItemsList"),
    backBtn: document.getElementById("backBtn"),
    submitBtn: document.getElementById("submitBtn"),
    formError: document.getElementById("formError"),
    successCloseBtn: document.getElementById("successCloseBtn")
  };

  function escapeHtml(str) {
    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function totalCartCount() {
    var total = 0;
    Object.keys(state.cart).forEach(function (id) { total += state.cart[id].qty; });
    return total;
  }

  function updateCartBar() {
    var count = totalCartCount();
    if (count > 0) {
      els.cartBar.classList.add("visible");
      els.cartBarText.textContent = "В заказе: " + count + (count === 1 ? " товар" : count < 5 ? " товара" : " товаров");
    } else {
      els.cartBar.classList.remove("visible");
    }
  }

  function qtyLabel(qty, unit) {
    return unit ? (qty + " " + unit) : String(qty);
  }

  function findItemById(id) {
    for (var c = 0; c < state.categories.length; c++) {
      var items = state.categories[c].items;
      for (var i = 0; i < items.length; i++) {
        if (items[i].id === id) return items[i];
      }
    }
    return null;
  }

  function setQty(id, qty) {
    var item = findItemById(id);
    if (!item) return;
    qty = Math.max(0, qty);
    if (qty === 0) {
      delete state.cart[id];
    } else {
      state.cart[id] = { name: item.name, qty: qty, article: item.article || "", unit: item.unit || "" };
    }
    renderCatalog();
    updateCartBar();
    if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
  }

  function cardTemplate(item) {
    var qty = state.cart[item.id] ? state.cart[item.id].qty : 0;
    var imageHtml = item.imageUrl
      ? '<img src="' + escapeHtml(item.imageUrl) + '" alt="" loading="lazy">'
      : '<div class="placeholder">Фото скоро будет</div>';

    var controlHtml = qty > 0
      ? '<div class="stepper">' +
          '<button data-action="dec" data-id="' + escapeHtml(item.id) + '">−</button>' +
          '<span class="qty-value">' + escapeHtml(qtyLabel(qty, item.unit)) + '</span>' +
          '<button data-action="inc" data-id="' + escapeHtml(item.id) + '">+</button>' +
        '</div>'
      : '<button class="add-btn" data-action="inc" data-id="' + escapeHtml(item.id) + '">Добавить в заказ</button>';

    return (
      '<div class="card">' +
        '<div class="card-image">' + imageHtml + '</div>' +
        '<div class="card-body">' +
          '<div class="card-name">' + escapeHtml(item.name) + '</div>' +
          (item.description ? '<div class="card-desc">' + escapeHtml(item.description) + '</div>' : '') +
          (item.article ? '<div class="card-article">Арт. ' + escapeHtml(item.article) + '</div>' : '') +
          '<div class="qty-row">' + controlHtml + '</div>' +
        '</div>' +
      '</div>'
    );
  }

  function renderCategoryPills() {
    els.categories.innerHTML = state.categories.map(function (c) {
      var active = c.category === state.activeCategory ? " active" : "";
      return '<button class="cat-pill' + active + '" data-cat="' + escapeHtml(c.category) + '">' + escapeHtml(c.category) + '</button>';
    }).join("");

    els.categories.querySelectorAll(".cat-pill").forEach(function (btn) {
      btn.addEventListener("click", function () {
        state.activeCategory = btn.getAttribute("data-cat");
        renderCategoryPills();
        var target = document.getElementById("section-" + cssEscape(state.activeCategory));
        if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    });
  }

  function cssEscape(str) {
    return String(str).replace(/[^a-zA-Z0-9а-яА-Я_-]/g, "_");
  }

  function renderCatalog() {
    if (!state.categories.length) {
      els.catalog.innerHTML = '<div class="empty-state">Каталог пока пуст</div>';
      return;
    }

    els.catalog.innerHTML = state.categories.map(function (c) {
      return (
        '<section class="category-section" id="section-' + cssEscape(c.category) + '">' +
          '<h2>' + escapeHtml(c.category) + '</h2>' +
          '<div class="grid">' + c.items.map(cardTemplate).join("") + '</div>' +
        '</section>'
      );
    }).join("");

    els.catalog.querySelectorAll("[data-action]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-id");
        var action = btn.getAttribute("data-action");
        var current = state.cart[id] ? state.cart[id].qty : 0;
        setQty(id, action === "inc" ? current + 1 : current - 1);
      });
    });
  }

  function loadProducts() {
    if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf("PASTE_YOUR") === 0) {
      state.demoMode = true;
      state.categories = DEMO_PRODUCTS;
      state.activeCategory = DEMO_PRODUCTS[0] && DEMO_PRODUCTS[0].category;
      renderCategoryPills();
      renderCatalog();
      return;
    }

    fetch(APPS_SCRIPT_URL + "?action=products")
      .then(function (r) { return r.json(); })
      .then(function (data) {
        state.categories = Array.isArray(data) ? data : [];
        state.activeCategory = state.categories[0] && state.categories[0].category;
        renderCategoryPills();
        renderCatalog();
      })
      .catch(function (err) {
        console.error(err);
        state.demoMode = true;
        state.categories = DEMO_PRODUCTS;
        state.activeCategory = DEMO_PRODUCTS[0] && DEMO_PRODUCTS[0].category;
        renderCategoryPills();
        renderCatalog();
      });
  }

  // ---- Order screen ----

  function renderOrderItems() {
    var ids = Object.keys(state.cart);
    if (!ids.length) {
      els.orderItemsList.innerHTML = '<div class="order-item-row"><span class="name">Корзина пуста</span></div>';
      return;
    }
    els.orderItemsList.innerHTML = ids.map(function (id) {
      var it = state.cart[id];
      var label = it.name + (it.article ? " (арт. " + it.article + ")" : "");
      return (
        '<div class="order-item-row">' +
          '<span class="name">' + escapeHtml(label) + '</span>' +
          '<div class="stepper">' +
            '<button data-action="dec" data-id="' + escapeHtml(id) + '">−</button>' +
            '<span class="qty-value">' + escapeHtml(qtyLabel(it.qty, it.unit)) + '</span>' +
            '<button data-action="inc" data-id="' + escapeHtml(id) + '">+</button>' +
          '</div>' +
        '</div>'
      );
    }).join("");

    els.orderItemsList.querySelectorAll("[data-action]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-id");
        var action = btn.getAttribute("data-action");
        var current = state.cart[id] ? state.cart[id].qty : 0;
        setQty(id, action === "inc" ? current + 1 : current - 1);
        renderOrderItems();
        if (totalCartCount() === 0) closeOrderScreen();
      });
    });
  }

  function openOrderScreen() {
    renderOrderItems();
    els.orderScreen.classList.add("visible");
    if (tg && tg.BackButton) {
      tg.BackButton.show();
      tg.BackButton.onClick(closeOrderScreen);
    }
    if (tg && tg.MainButton) tg.MainButton.hide();
  }

  function closeOrderScreen() {
    els.orderScreen.classList.remove("visible");
    if (tg && tg.BackButton) tg.BackButton.hide();
  }

  els.cartBar.addEventListener("click", openOrderScreen);
  els.backBtn.addEventListener("click", closeOrderScreen);

  function showFormError(msg) {
    els.formError.textContent = msg;
    els.formError.style.display = "block";
  }
  function clearFormError() {
    els.formError.style.display = "none";
  }

  function collectFormData() {
    return {
      company: document.getElementById("fCompany").value.trim(),
      address: document.getElementById("fAddress").value.trim(),
      customerName: document.getElementById("fName").value.trim(),
      phone: document.getElementById("fPhone").value.trim(),
      email: document.getElementById("fEmail").value.trim()
    };
  }

  function validateForm(data) {
    if (!data.company) return "Укажите название организации";
    if (!data.address) return "Укажите адрес доставки";
    if (!data.customerName) return "Укажите имя заказчика";
    if (!data.phone) return "Укажите номер телефона";
    if (!data.email) return "Укажите email";
    var emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email);
    if (!emailOk) return "Проверьте формат email";
    return null;
  }

  function submitOrder() {
    clearFormError();
    if (totalCartCount() === 0) {
      showFormError("Добавьте хотя бы один товар в заказ");
      return;
    }
    var formData = collectFormData();
    var error = validateForm(formData);
    if (error) {
      showFormError(error);
      return;
    }

    var items = Object.keys(state.cart).map(function (id) {
      return {
        id: id,
        name: state.cart[id].name,
        qty: state.cart[id].qty,
        article: state.cart[id].article || "",
        unit: state.cart[id].unit || ""
      };
    });

    var tgUser = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user : {};

    var payload = {
      company: formData.company,
      address: formData.address,
      customerName: formData.customerName,
      phone: formData.phone,
      email: formData.email,
      items: items,
      tgUserId: tgUser.id || "",
      tgUsername: tgUser.username || ""
    };

    els.submitBtn.disabled = true;
    els.submitBtn.textContent = "Отправляем…";

    if (state.demoMode) {
      // В демо-режиме (без подключённого Apps Script) просто показываем успех.
      setTimeout(function () { onOrderSuccess(); }, 500);
      return;
    }

    fetch(APPS_SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, // избегаем CORS preflight
      body: JSON.stringify(payload)
    })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (res && res.ok) {
          onOrderSuccess();
        } else {
          throw new Error((res && res.error) || "Неизвестная ошибка");
        }
      })
      .catch(function (err) {
        console.error(err);
        showFormError("Не удалось отправить заказ. Попробуйте ещё раз.");
        els.submitBtn.disabled = false;
        els.submitBtn.textContent = "Отправить заказ";
      });
  }

  function onOrderSuccess() {
    state.cart = {};
    updateCartBar();
    renderCatalog();
    closeOrderScreen();
    els.successScreen.classList.add("visible");
    els.submitBtn.disabled = false;
    els.submitBtn.textContent = "Отправить заказ";
    ["fCompany", "fAddress", "fName", "fPhone", "fEmail"].forEach(function (id) {
      document.getElementById(id).value = "";
    });
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
  }

  els.submitBtn.addEventListener("click", submitOrder);
  els.successCloseBtn.addEventListener("click", function () {
    els.successScreen.classList.remove("visible");
  });

  loadProducts();
})();
</script>
</body>
</html>
